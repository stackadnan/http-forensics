[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "http-forensics"
version = "0.1.0"
description = "A reproducible toolkit for investigating and documenting HTTP behavior."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["PyYAML>=5.4"]

[tool.setuptools.packages.find]
where = ["src"]
