[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "http-forensics"
version = "0.1.0"
description = "A reproducible toolkit for investigating and documenting HTTP behavior."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "stackadnan" }]
keywords = ["http", "http-testing", "redirects", "cookies", "caching", "curl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.9"
dependencies = ["PyYAML>=5.4"]

[project.urls]
Homepage = "https://github.com/stackadnan/http-forensics"
Issues = "https://github.com/stackadnan/http-forensics/issues"

[tool.setuptools.packages.find]
where = ["src"]
